# Serves the built SPA and proxies /api to the api service.
# `api` is resolved when nginx starts; compose starts web only after api is healthy.

# Keep the id the client sent, otherwise use nginx's own. The API validates it and
# echoes it back, so one id follows a request from nginx to the log lines.
map $http_x_request_id $baton_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $baton_request_id;

    # Server-Sent Events (phase 7): never buffer, allow a long-lived connection.
    location = /api/v1/stream {
        proxy_pass http://api:8000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Connection "";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths load index.html and React Router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
