[project]
name = "baton-api"
version = "0.1.0"
description = "Baton API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "argon2-cffi",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "hypothesis",
    "time-machine",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit
    "ASYNC",         # blocking calls in async code
    "C4", "SIM", "RET", "PT", "PTH", "RUF", "T20", "DTZ", "TID",
]
ignore = ["S101"]  # assert is how pytest works; app code uses explicit errors

[tool.ruff.lint.isort]
# api/alembic/ is a migrations folder, not the alembic library
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["T201", "PT018", "PT011"]  # asserts state invariants, not a test module
"scripts/seedlib/text.py" = ["E501"]  # prose pools
"alembic/**" = ["S608"]  # f-strings over fixed constants, no user input

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*"]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
