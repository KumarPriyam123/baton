# Test overlay. Use with compose.yaml:
#   docker compose -f compose.yaml -f compose.test.yaml run --rm api-test
#   docker compose -f compose.yaml -f compose.test.yaml run --rm web-test
# The test database lives on tmpfs: fast, and nothing survives the run.

services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton
      POSTGRES_DB: baton_test
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-test:
    build:
      context: ./api
      target: test
    environment:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://baton:baton@db-test:5432/baton_test
      TEST_DATABASE_URL: postgresql+asyncpg://baton:baton@db-test:5432/baton_test
    # Mount the source: `compose run` does not rebuild a stale image, and tests that
    # silently run old code are worse than slow tests. Dependencies live in /opt/venv
    # (not under /app), so the mount cannot hide them; changing them still needs --build.
    volumes:
      - ./api:/app
    depends_on:
      db-test:
        condition: service_healthy
    command: ["pytest"]

  web-test:
    build:
      context: ./web
      target: test
    command: ["npm", "run", "test"]
