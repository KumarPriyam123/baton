name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baton
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baton -d baton_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://baton:baton@localhost:5432/baton_test
      TEST_DATABASE_URL: postgresql+asyncpg://baton:baton@localhost:5432/baton_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No CRLF in the index (breaks entrypoints inside Linux containers)
        run: |
          if git ls-files --eol | grep -E 'i/(crlf|mixed)'; then
            echo "::error::CRLF line endings are committed"; exit 1
          fi
      - name: Brief PDF and .env are not tracked
        run: |
          if git ls-files | grep -E '\.pdf$|(^|/)\.env$'; then
            echo "::error::A PDF or .env is tracked"; exit 1
          fi
      # Full history, same pinned version as .pre-commit-config.yaml. The gitleaks action
      # builds the range "<first commit>^..HEAD", which git rejects for a root commit.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1             detect --source /repo --redact --no-banner --verbose
